name: Deploy Gxsio Docs

on:
  push:
    branches:
      - main
    paths:
      - "apps/gxsio/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-docs.yml"
      - ".github/workflows/ci-nextjs-app.yml"
      - ".github/workflows/deploy-nextjs-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gxsio-docs-production
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-nextjs-app.yml
    with:
      app_name: gxsio

  deploy_prod:
    needs: test
    uses: ./.github/workflows/deploy-nextjs-app.yml
    with:
      app_name: gxsio
      image_name: gxsio-docs
      dockerfile: apps/gxsio/Dockerfile
      manifest_path: graphxserver/web/public-docs/deployment.yaml
    secrets: inherit
