name: Deploy Next.js App

on:
  workflow_call:
    inputs:
      app_name:
        description: Folder name under apps/
        required: true
        type: string
      image_name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      manifest_path:
        description: Deployment manifest path in the GitOps repository
        required: true
        type: string
    secrets:
      GITOPS_TOKEN:
        required: true
      ACR_REGISTRY:
        required: true
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.app_name }} to production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      IMAGE_NAME: ${{ inputs.image_name }}
      MANIFEST_PATH: ${{ inputs.manifest_path }}
      GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY || format('{0}/devops-apps', github.repository_owner) }}
    steps:
      - name: Checkout application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops
          fetch-depth: 0

      - name: Install Kubernetes validation tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/kubeconform.tar.gz"
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/bin" kubeconform
          chmod 0755 "$RUNNER_TEMP/bin/kubeconform"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate production GitOps manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="gitops/${MANIFEST_PATH}"
          kubeconform -strict -summary -kubernetes-version 1.31.0 "$manifest"
          [[ $(grep -cE '^[[:space:]]*image:' "$manifest") -eq 1 ]] || {
            echo "Expected exactly one image in ${manifest}"
            exit 1
          }

      - name: Resolve immutable image tag
        id: meta
        shell: bash
        run: echo "image_tag=prod-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        uses: azure/docker-login@15c4aadf093404726ab2ff205b2cdd33fa6d054c # v2
        with:
          login-server: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push production image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ inputs.image_name }}:${{ steps.meta.outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Update production GitOps manifest
        shell: bash
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          manifest="gitops/${MANIFEST_PATH}"
          image_ref="${ACR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}@${IMAGE_DIGEST}"

          [[ "$IMAGE_TAG" =~ ^prod-[0-9a-f]{40}$ ]] || {
            echo "Image tag is not a full Git SHA: $IMAGE_TAG"
            exit 1
          }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Image digest is invalid: $IMAGE_DIGEST"
            exit 1
          }

          sed -i "s|^\([[:space:]]*image:\).*|\1 ${image_ref}|" "$manifest"

          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST_PATH"
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(gitops): deploy ${IMAGE_NAME} ${IMAGE_TAG} to production [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "GitOps push attempt ${attempt} failed, retrying..."
            sleep $((attempt * 3))
          done
          echo 'Failed to push GitOps update after retries'
          exit 1
